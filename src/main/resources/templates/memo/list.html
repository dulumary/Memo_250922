<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">

<section layout:fragment="contents" class="contents d-flex justify-content-center">
    <div class="memo-box my-5">
        <h1 class="text-center">메모 리스트</h1>

        <table class="table text-center mt-4">
            <thead>
                <tr>
                    <th>No</th>
                    <th>제목</th>
                    <th>작성일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="memo:${memoList}">
                    <td th:text="${memo.id}">24</td>
                    <td><a th:href="|/memo/detail?id=${memo.id}|" th:text="${memo.title}">오늘 해야 할일</a></td>
                    <td th:text="${#temporals.format(memo.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2025-09-29 21:14:12</td>
                </tr>

            </tbody>
        </table>
        <div class="d-flex justify-content-end mt-3">
            <a href="/memo/write" class="btn btn-secondary">메모 쓰기</a>
        </div>
    </div>

</section>

</html>
